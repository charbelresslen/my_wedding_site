<section class="hero" aria-labelledby="hero-names">
  <div class="card">
    <!-- a few tiny gold glints -->
    <span class="sparkles" aria-hidden="true">
      <i style="--x: 46%; --y: 15%; --s: 11px; --t: 0.2s"></i>
      <i style="--x: 13%; --y: 9%; --s: 7px; --t: 1.6s"></i>
      <i style="--x: 87%; --y: 12%; --s: 8px; --t: 2.4s"></i>
      <i style="--x: 70%; --y: 27%; --s: 6px; --t: 3.1s"></i>
      <i style="--x: 22%; --y: 60%; --s: 6px; --t: 0.9s"></i>
      <i style="--x: 92%; --y: 62%; --s: 8px; --t: 1.9s"></i>
    </span>

    <!-- The photo, exactly as it is: full width, nothing drawn over it -->
    <div class="photo-wrap">
      <img
        class="photo"
        src="media/hero-couple.webp"
        width="1448"
        height="1086"
        alt="Шарбель и Анна, держась за руки, стоят в светлом зале у высокого арочного окна, за которым закат над городом"
        fetchpriority="low"
        decoding="async"
      />
    </div>

    <div class="copy">
      <p class="kicker reveal">Добро пожаловать<br />на свадьбу</p>

      <img
        class="divider grow"
        src="media/divider.webp"
        width="1000"
        height="147"
        alt=""
        aria-hidden="true"
        decoding="async"
      />

      <h1 class="names reveal" id="hero-names">
        <span class="name name-1">Шарбель</span>
        <span class="line-2">
          <span class="amp" aria-hidden="true">&amp;</span>
          <span class="visually-hidden"> и </span>
          <span class="name name-2">Анна</span>
        </span>
      </h1>
    </div>

    <img class="flower flower-left" src="media/flower-left.webp" width="448" height="566" alt="" decoding="async" />
    <img class="flower flower-right" src="media/flower-right.webp" width="448" height="566" alt="" decoding="async" />
  </div>
</section>
