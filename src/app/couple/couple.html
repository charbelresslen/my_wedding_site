<section class="couple" aria-labelledby="couple-title">
  <div class="col">
    <!-- the title is not shown (the sentence and the photos speak for themselves) but still names the section for a screen reader -->
    <h2 class="visually-hidden" id="couple-title">Наша история</h2>

    <img class="divider divider-top reveal" data-reveal safeSrc="media/divider.webp" width="1000" height="147" alt="" aria-hidden="true" decoding="async" loading="lazy" />

    <p class="lead reveal" data-reveal>
      Мы благодарны судьбе за каждый день, что привёл нас друг к другу, и с трепетом ждём дня, когда мы официально
      станем одной семьёй.
    </p>

    <img class="divider divider-bottom reveal" data-reveal safeSrc="media/divider.webp" width="1000" height="147" alt="" aria-hidden="true" decoding="async" loading="lazy" />

    <!-- a little vintage board the two photos are taped to, like a page from an album -->
    <div class="board reveal" data-reveal>
      <figure class="polaroid polaroid-a">
        <span class="tape tape-a1" aria-hidden="true"></span>
        <span class="tape tape-a2" aria-hidden="true"></span>
        <img
          class="photo photo-a"
          safeSrc="media/couple-dinner.webp"
          width="1400"
          height="1867"
          alt="Шарбель и Анна на ужине у моря на закате"
          decoding="async"
          loading="lazy"
        />
      </figure>

      <figure class="polaroid polaroid-b">
        <span class="tape tape-b1" aria-hidden="true"></span>
        <img
          class="photo photo-b"
          safeSrc="media/couple-beach.webp"
          width="960"
          height="1280"
          alt="Шарбель и Анна у моря: она стоит впереди в солнечных очках и улыбается, он обнимает её сзади и целует в щёку"
          decoding="async"
          loading="lazy"
        />
      </figure>
    </div>
  </div>
</section>
