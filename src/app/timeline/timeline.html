<section class="timeline" id="timeline" aria-labelledby="timeline-title">
  <header class="head" data-reveal>
    <h2 class="title reveal" id="timeline-title">Программа дня</h2>
    <img
      class="rule reveal"
      src="media/timeline-rule.webp"
      width="1000"
      height="88"
      alt=""
      aria-hidden="true"
      decoding="async"
      loading="lazy"
    />
  </header>

  <div class="track">
    <!-- the rail: the first stick's finial, a plain rod, the last stick's finial -->
    <div class="rail" aria-hidden="true">
      <img class="cap cap-top" src="media/timeline-top.webp" width="162" height="430" alt="" decoding="async" loading="lazy" />
      <img class="rod" src="media/timeline-rod.webp" width="162" height="120" alt="" decoding="async" loading="lazy" />
      <img class="cap cap-bottom" src="media/timeline-bottom.webp" width="162" height="408" alt="" decoding="async" loading="lazy" />
    </div>

    <ol class="list">
      @for (step of steps; track step.time; let i = $index) {
        <li class="step" [class.step-flip]="i % 2 === 1" data-reveal>
          <div class="art">
            <img
              [src]="step.art"
              [attr.width]="step.width"
              [attr.height]="step.height"
              alt=""
              aria-hidden="true"
              decoding="async"
              loading="lazy"
            />
          </div>
          <span class="node" aria-hidden="true"></span>
          <div class="info">
            <p class="time"><time [attr.datetime]="step.time">{{ step.time }}</time></p>
            <p class="label">{{ step.label }}</p>
          </div>
        </li>
      }
    </ol>

    <!-- the flower that rides the rail as the page scrolls -->
    <img class="flower" src="media/timeline-flower.webp" width="256" height="246" alt="" aria-hidden="true" decoding="async" />
  </div>
</section>
