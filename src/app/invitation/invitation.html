<section class="invite" id="invitation" aria-labelledby="invite-names">
  <div class="stage">
    <div class="card">
      <img
        class="wall"
        src="media/zags-wall.webp"
        width="1024"
        height="1350"
        alt=""
        aria-hidden="true"
        decoding="async"
        fetchpriority="low"
      />

      <div class="writing">
        <p class="kicker reveal">Вы приглашены на церемонию бракосочетания</p>

        <h2 class="names" id="invite-names">
          <span class="name name-1 reveal">Шарбель</span>{{ ' ' }}
          <span class="name name-2 reveal">
            <span class="amp" aria-hidden="true">&amp;</span><span class="visually-hidden">и</span>{{ ' ' }}Анна
          </span>
        </h2>

        <img
          class="divider reveal"
          src="media/divider.webp"
          width="1000"
          height="147"
          alt=""
          aria-hidden="true"
          decoding="async"
          loading="lazy"
        />

        <p class="dear reveal">Дорогие родные и друзья</p>
        <p class="note reveal">
          Будем счастливы разделить с вами день, с которого начнётся наша семья.
        </p>
      </div>
    </div>

    <span class="flower flower-left" aria-hidden="true">
      <img src="media/peony-left.webp" width="275" height="407" alt="" decoding="async" />
    </span>
    <span class="flower flower-right" aria-hidden="true">
      <img src="media/peony-right.webp" width="275" height="407" alt="" decoding="async" />
    </span>
  </div>
</section>
