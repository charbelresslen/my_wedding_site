<section class="invite" id="invitation" aria-labelledby="invite-title">
  <div class="stage">
    <div class="card">
      <img
        class="wall"
        safeSrc="media/zags-wall.webp"
        width="1024"
        height="1350"
        alt=""
        aria-hidden="true"
        decoding="async"
        fetchpriority="low"
      />

      <div class="writing">
        <h2 class="dear reveal" id="invite-title">Дорогие родные и друзья</h2>

        <img
          class="divider reveal"
          safeSrc="media/divider.webp"
          width="1000"
          height="147"
          alt=""
          aria-hidden="true"
          decoding="async"
          loading="lazy"
        />

        <p class="note reveal">Мы будем счастливы разделить с вами день, с которого начнётся наша семья!</p>
      </div>
    </div>

    <span class="flower flower-left" aria-hidden="true">
      <img safeSrc="media/peony-left.webp" width="275" height="407" alt="" decoding="async" />
    </span>
    <span class="flower flower-right" aria-hidden="true">
      <img safeSrc="media/peony-right.webp" width="275" height="407" alt="" decoding="async" />
    </span>
  </div>
</section>
