<audio #audio [src]="MUSIC_SRC" loop preload="auto"></audio>

@if (playing()) {
  <button #button class="toggle" type="button" [attr.aria-pressed]="!muted()" [attr.aria-label]="muted() ? 'Включить музыку' : 'Выключить музыку'" (click)="toggleMuted()">
    @if (muted()) {
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <path d="M16.5 8.5l5 7M21.5 8.5l-5 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <path d="M16.2 8.8a5 5 0 0 1 0 6.4M19 6.5a9 9 0 0 1 0 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none" />
      </svg>
    }
  </button>
}
